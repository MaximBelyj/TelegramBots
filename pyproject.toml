[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmr-market-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.15,<4", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]

[project.scripts]
dmr-bot = "dmr_bot.bot:main"

[tool.setuptools.packages.find]
include = ["dmr_bot*"]
